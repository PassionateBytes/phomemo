# The documentation site (Sphinx). Not a package: it only gathers the tools
# and the library the API pages are generated from.

[project]
name = "phomemo-docs"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "shibuya>=2025.1",
    "myst-parser>=4",
    "phomemo",
    "sphinx>=8",
]

[tool.uv]
package = false

[tool.uv.sources]
phomemo = { workspace = true }

# uv workspace: the library and the documentation site share one lock file.
# The root is no project of its own; each member has its own pyproject.toml.

[tool.uv.workspace]
members = ["src/phomemo", "docs"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

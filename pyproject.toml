[project]
name = "phomemo-workspace"
version = "0.0.0"
description = "Workspace root for phomemo packages"
requires-python = ">=3.13"
dependencies = [
    "phomemo",
]

[tool.uv.sources]
phomemo = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
    "ty>=0.0.26",
]
docs = [
    "furo>=2024.8",
    "myst-parser>=4",
    "sphinx>=8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["packages/phomemo/tests"]

# Docs: builds the documentation site and deploys it to GitHub Pages. Runs on
# pushes to main, on v* tags and by hand.
#
# The site is versioned and kept on the gh-pages branch: latest/ is built from
# main, x.y.z/ from each v* tag, and stable/ is a copy of the newest release,
# where the site root and the unversioned page URLs redirect (to latest/ until
# there is a release). docs/publish.py places one build into the site and
# regenerates versions.json (read by the version menu) and the root redirects.
#
# Jobs:
#   build   Sphinx build of one version, committed into gh-pages; retried
#           when another run pushed to gh-pages first.
#   deploy  uploads gh-pages to Pages. Queued, never cancelled: each run
#           deploys the branch as it is when the run starts, so the last run
#           includes every publish.
#
# A manual run with a tag (e.g. v0.3.0) rebuilds that release; without one it
# rebuilds latest from main.

name: Docs
run-name: Docs ${{ inputs.ref || (github.ref_type == 'tag' && github.ref_name) || 'latest' }}

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to (re)build, e.g. v0.3.0; empty builds latest from main"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs-${{ inputs.ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Pick the version
        id: version
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          case "$REF" in
            v*) echo "name=${REF#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "name=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build the site
        env:
          DOCS_VERSION: ${{ steps.version.outputs.name }}
        run: uv run --package phomemo-docs sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Publish into the gh-pages branch
        id: publish
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          site="$RUNNER_TEMP/site"
          for attempt in 1 2 3 4 5; do
            git worktree remove --force "$site" 2>/dev/null || true
            git branch -D gh-pages 2>/dev/null || true
            if git fetch --depth 1 origin gh-pages; then
              git worktree add -B gh-pages "$site" FETCH_HEAD
            else
              git worktree add --orphan -b gh-pages "$site"
            fi
            uv run --package phomemo-docs python docs/publish.py "$site" docs/_build/html "$VERSION"
            git -C "$site" add -A
            if git -C "$site" diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git -C "$site" commit -q -m "docs: publish $VERSION (${GITHUB_SHA::7})"
            if git -C "$site" push origin gh-pages; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "commit=$(git -C "$site" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CHANGED: ${{ steps.publish.outputs.changed }}
          COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          base=https://passionatebytes.github.io/phomemo-driver
          if [ "$CHANGED" != true ]; then
            echo "No changes, gh-pages left as it was" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          versions="$RUNNER_TEMP/site/versions.json"
          stable=$(jq -r '.stable // empty' "$versions")
          if [ -n "$stable" ]; then
            stable="$stable, $base/stable/"
          else
            stable="none yet"
          fi
          {
            echo "### Published $VERSION"
            echo
            echo "| Site | Value |"
            echo "|---|---|"
            echo "| This version | $base/$VERSION/ |"
            echo "| Stable | $stable |"
            echo "| All versions | $(jq -r '.versions | join(", ")' "$versions") |"
            echo "| gh-pages commit | \`$COMMIT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

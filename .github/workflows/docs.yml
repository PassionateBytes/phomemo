name: Docs

# Versioned site: main builds latest/, each v* tag builds its release
# directory and, when it is the newest release, stable/. The site is kept on
# the gh-pages branch (docs/publish.py) and deployed from there to Pages.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to (re)build, e.g. v0.3.0; empty builds latest from main"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs-${{ inputs.ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Pick the version
        id: version
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          case "$REF" in
            v*) echo "name=${REF#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "name=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build the site
        env:
          DOCS_VERSION: ${{ steps.version.outputs.name }}
        run: uv run --package phomemo-docs sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Publish into the gh-pages branch
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          site="$RUNNER_TEMP/site"
          for attempt in 1 2 3 4 5; do
            git worktree remove --force "$site" 2>/dev/null || true
            git branch -D gh-pages 2>/dev/null || true
            if git fetch --depth 1 origin gh-pages; then
              git worktree add -B gh-pages "$site" FETCH_HEAD
            else
              git worktree add --orphan -b gh-pages "$site"
            fi
            uv run --package phomemo-docs python docs/publish.py "$site" docs/_build/html "$VERSION"
            git -C "$site" add -A
            git -C "$site" diff --cached --quiet && exit 0
            git -C "$site" commit -q -m "docs: publish $VERSION (${GITHUB_SHA::7})"
            git -C "$site" push origin gh-pages && exit 0
            sleep $((attempt * 5))
          done
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Queued, never cancelled mid-deploy: each run deploys the branch as it
    # is when the run starts, so the last one includes every publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

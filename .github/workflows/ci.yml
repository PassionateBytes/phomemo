# CI: the gate for every change. Runs on pull requests and on pushes to main.
#
# Jobs:
#   releases  asks Fedora's Bodhi for every release that still gets updates,
#             from MIN_FEDORA on (fedora:latest when Bodhi is unreachable),
#             plus Rawhide. Rawhide is informational: its failures show in
#             the job summary and as a warning but leave the job green, so a
#             Rawhide breakage outside this project never blocks a merge.
#   test      per release: lint and docs build (newest release only), printer
#             app build, C unit tests, Python tests including the end-to-end
#             tests against the built printer app.
#   rpm       per release: python-bleak built as COPR and OBS build it, at
#             the version its spec names, and installed; then phomemo-driver
#             built against it and installed. Catches a bleak bump Fedora
#             cannot satisfy before it reaches main.
#   deb       Debian 13 and Ubuntu 24.04: the Debian packages built as OBS
#             builds them (make deb), checked with lintian and installed.
#   floor     the library's version floors (Python 3.12, bleak 0.21, Pillow
#             10.1): the Python tests on Ubuntu 24.04 with the distribution's
#             own python3, bleak, Pillow, pytest and pytest-asyncio packages.
#             Catches library code that needs a newer dependency than the
#             declared range promises.
#
# Renovate automerges dependency updates once this workflow is green: what it
# does not check, a dependency update can break unnoticed.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Bodhi lists two current releases most of the year, three for a few weeks
  # after a new release.
  releases:
    name: Fedora releases
    runs-on: ubuntu-latest
    env:
      # The oldest release the RPM packages are built and tested for.
      MIN_FEDORA: 44
    outputs:
      all: ${{ steps.bodhi.outputs.all }}
      newest: ${{ steps.bodhi.outputs.newest }}
    steps:
      - id: bodhi
        shell: python
        run: |
          import json, os, re, urllib.request

          url = "https://bodhi.fedoraproject.org/releases/?state=current&rows_per_page=50"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  releases = json.load(response)["releases"]
              minimum = int(os.environ["MIN_FEDORA"])
              versions = sorted(
                  v
                  for r in releases
                  if (m := re.fullmatch(r"F(\d+)", r["name"])) and (v := int(m[1])) >= minimum
              )
          except Exception as error:
              print(f"::warning::Bodhi unreachable ({error}); testing fedora:latest only")
              versions = []
          names = [str(v) for v in versions] or ["latest"]
          print("Fedora releases:", ", ".join(names), "+ rawhide")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"all={json.dumps(names + ['rawhide'])}\nnewest={names[-1]}\n")

  test:
    name: Tests (Fedora ${{ matrix.fedora }})
    needs: releases
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.releases.outputs.all) }}
    steps:
      - name: Install build and test dependencies
        continue-on-error: ${{ matrix.fedora == 'rawhide' }}
        run: >
          dnf install -y --setopt=install_weak_deps=False
          gcc make pkgconf-pkg-config pappl-devel cjson-devel cups-devel
          python3 python3-pip git cups-ipptool ghostscript avahi util-linux
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv
      # The suite runs as an ordinary user, as on a developer machine: as
      # root, the printer application's test servers would use the system
      # socket and state paths instead of the per-test ones.
      - name: Create the test user
        run: |
          useradd --create-home tester
          chown -R tester "$GITHUB_WORKSPACE"
      - name: Python environment
        continue-on-error: ${{ matrix.fedora == 'rawhide' }}
        run: su tester -c "uv sync --all-packages"
      # Lint and docs do not depend on the Fedora release: newest only.
      - name: Lint
        id: lint
        if: matrix.fedora == needs.releases.outputs.newest
        run: su tester -c "uv run ruff check . && uv run ruff format --check ."
      - name: Build the printer application
        id: build
        continue-on-error: ${{ matrix.fedora == 'rawhide' }}
        run: su tester -c "make -C src/printer-app"
      - name: C unit tests
        id: ctests
        continue-on-error: ${{ matrix.fedora == 'rawhide' }}
        run: su tester -c "make -C src/printer-app test"
      # The output is kept in /tmp/pytest.log for the summary; pipefail keeps
      # pytest's exit status as the step's.
      - name: Python tests (library, bridge, end-to-end against the built application)
        id: pytests
        continue-on-error: ${{ matrix.fedora == 'rawhide' }}
        run: su tester -c "set -o pipefail; uv run pytest -q src/phomemo/tests 2>&1 | tee /tmp/pytest.log"
      - name: Documentation
        id: docs
        if: matrix.fedora == needs.releases.outputs.newest
        run: su tester -c "uv run --package phomemo-docs sphinx-build -W --keep-going -b html docs docs/_build/html"
      - name: Summary
        if: always()
        shell: bash
        env:
          FEDORA: ${{ matrix.fedora }}
          BUILD: ${{ steps.build.outcome }}
          LINT: ${{ steps.lint.outcome }}
          CTESTS: ${{ steps.ctests.outcome }}
          PYTESTS: ${{ steps.pytests.outcome }}
          DOCS: ${{ steps.docs.outcome }}
        run: |
          result() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *) echo "${1:-skipped}" ;;
            esac
          }
          counts=$(tail -n 1 /tmp/pytest.log 2>/dev/null | sed 's/^=* *//; s/ *=*$//')
          {
            echo "### Tests (Fedora $FEDORA)"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint (ruff) | $(result "$LINT") |"
            echo "| Printer app build | $(result "$BUILD") |"
            echo "| C unit tests | $(result "$CTESTS") |"
            echo "| Python tests | $(result "$PYTESTS")${counts:+ $counts} |"
            echo "| Documentation | $(result "$DOCS") |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FEDORA" = rawhide ] && [[ " $BUILD $CTESTS $PYTESTS " == *" failure "* ]]; then
            echo "::warning::Rawhide: tests failed (informational, see the summary)"
          fi

  # Fedora has no bleak: python-bleak builds against Fedora's own dbus-fast.
  rpm:
    name: RPM packages (Fedora ${{ matrix.fedora }})
    needs: releases
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.releases.outputs.all) }}
    steps:
      - name: Install packaging tools
        continue-on-error: ${{ matrix.fedora == 'rawhide' }}
        run: >
          dnf install -y --setopt=install_weak_deps=False
          rpm-build rpmdevtools rpmlint python3-rpm-macros git make
      - uses: actions/checkout@v4
      - name: Mark the checkout safe for git archive
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Lint the spec file
        run: rpmlint packaging/rpm/phomemo-driver.spec
      - name: Source packages as COPR makes them
        id: sources
        continue-on-error: ${{ matrix.fedora == 'rawhide' }}
        run: |
          make -f .copr/Makefile srpm outdir="$PWD/dist" spec=packaging/rpm/python-bleak.spec
          make tarball
          cp packaging/rpm/phomemo-driver.spec dist/
      - name: Build and install the packages
        id: build
        continue-on-error: ${{ matrix.fedora == 'rawhide' }}
        shell: bash
        run: |
          defs=(--define "_sourcedir $PWD/dist" --define "_rpmdir $PWD/dist"
                --define "_srcrpmdir $PWD/dist")
          # The specs generate their Python build requirements in rounds
          # (the build backend first, then the package's own requirements);
          # keep installing them until rpmbuild -br finds nothing missing.
          build() {
            dnf builddep -y "$1"
            for round in 1 2 3 4 5; do
              rm -f dist/*.buildreqs.nosrc.rpm
              rpmbuild -br "${defs[@]}" "$1" && break
              dnf builddep -y dist/*.buildreqs.nosrc.rpm
            done
            rpmbuild -ba "${defs[@]}" "$1"
          }
          build dist/python-bleak.spec
          dnf install -y dist/noarch/python3-bleak-*.rpm
          build dist/phomemo-driver.spec
          dnf install -y dist/noarch/python3-phomemo-*.rpm dist/x86_64/phomemo-driver-*.rpm
          python3 -c "import bleak, phomemo, importlib.metadata as m; print('bleak', m.version('bleak'), 'phomemo', m.version('phomemo'))"
          ls -R dist
      - name: Summary
        if: always()
        shell: bash
        env:
          FEDORA: ${{ matrix.fedora }}
          SOURCES: ${{ steps.sources.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          bleak=$(sed -n 's/^Version:[[:space:]]*//p' packaging/rpm/python-bleak.spec)
          {
            echo "### RPM packages (Fedora $FEDORA)"
            echo
            echo "bleak ${bleak:-unknown} (from python-bleak.spec)"
            echo
            if [ "$SOURCES" = failure ] || [ "$BUILD" = failure ]; then
              echo "❌ Build or install failed"
              echo
            fi
            # shellcheck disable=SC2016  # literal backticks: Markdown code
            find dist -name '*.rpm' ! -name '*.src.rpm' ! -name '*.nosrc.rpm' \
              ! -name '*-debuginfo-*' ! -name '*-debugsource-*' -printf '- `%f`\n' 2>/dev/null | sort
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FEDORA" = rawhide ] && { [ "$SOURCES" = failure ] || [ "$BUILD" = failure ]; }; then
            echo "::warning::Rawhide: RPM build failed (informational, see the summary)"
          fi

  # The Debian packages as OBS builds them: debian/ assembled from
  # packaging/debian/debian.* (make deb), built with the distribution's
  # debhelper, pybuild and dependencies, checked with lintian, installed.
  deb:
    name: Debian packages (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "Debian 13", image: "debian:trixie"}
          - {name: "Ubuntu 24.04", image: "ubuntu:24.04"}
    steps:
      - name: Install the packaging tools and build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-sequence-python3 pybuild-plugin-pyproject \
            python3-all python3-hatchling python3-bleak python3-pil \
            python3-pytest python3-pytest-asyncio \
            libpappl-dev libcjson-dev libcups2-dev pkgconf \
            lintian git ca-certificates
      - uses: actions/checkout@v4
      - name: Build the packages
        id: build
        run: make deb
      - name: Lint the packages
        id: lint
        run: lintian --fail-on error --tag-display-limit 0 dist/*.deb
      - name: Install the packages
        id: install
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y --no-install-recommends ./dist/*.deb
          python3 -c "import bleak, phomemo, importlib.metadata as m; print('bleak', m.version('bleak'), 'phomemo', m.version('phomemo'))"
          phomemo-bridge --version
          test -x /usr/bin/phomemo-printer-app
          test -f /usr/lib/systemd/system/phomemo-printer-app.service
          test -f /usr/lib/systemd/system/phomemo-bridge.service
          test -f /usr/lib/sysusers.d/phomemo.conf
          test -f /etc/phomemo/bridge.toml
      - name: Summary
        if: always()
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          BUILD: ${{ steps.build.outcome }}
          LINT: ${{ steps.lint.outcome }}
          INSTALL: ${{ steps.install.outcome }}
        run: |
          result() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *) echo "${1:-skipped}" ;;
            esac
          }
          {
            echo "### Debian packages ($NAME)"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Build (make deb) | $(result "$BUILD") |"
            echo "| lintian | $(result "$LINT") |"
            echo "| Install | $(result "$INSTALL") |"
            echo
            # shellcheck disable=SC2016  # literal backticks: Markdown code
            find dist -name '*.deb' -printf '- `%f`\n' 2>/dev/null | sort
          } >> "$GITHUB_STEP_SUMMARY"

  # The declared floors, with the packages an LTS distribution ships: no uv,
  # no lock file. The printer application is not built here; its end-to-end
  # module skips without the binary. uv comes from PyPI because the packaging
  # tests build the wheel and sdist with it.
  floor:
    name: Version floors (Ubuntu 24.04)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install the distribution's packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-pip python3-bleak python3-pil \
            python3-pytest python3-pytest-asyncio git ca-certificates
          pip install --break-system-packages uv
      - uses: actions/checkout@v4
      - name: Install the library against the distribution's dependencies
        run: pip install --break-system-packages --no-deps ./src/phomemo
      - name: Versions
        run: >
          python3 -c "import sys, importlib.metadata as m, pytest, pytest_asyncio;
          print('Python', sys.version.split()[0], 'bleak', m.version('bleak'),
          'Pillow', m.version('pillow'), 'pytest', pytest.__version__,
          'pytest-asyncio', pytest_asyncio.__version__)" | tee /tmp/versions.txt
      - name: Python tests
        id: pytests
        shell: bash
        working-directory: src/phomemo
        run: set -o pipefail; python3 -m pytest -q tests 2>&1 | tee /tmp/pytest.log
      - name: Summary
        if: always()
        shell: bash
        env:
          PYTESTS: ${{ steps.pytests.outcome }}
        run: |
          counts=$({ tail -n 1 /tmp/pytest.log 2>/dev/null || true; } | sed 's/^=* *//; s/ *=*$//')
          {
            echo "### Version floors (Ubuntu 24.04)"
            echo
            echo "$(cat /tmp/versions.txt 2>/dev/null)"
            echo
            case "$PYTESTS" in
              success) echo "✅ Python tests${counts:+ ($counts)}" ;;
              failure) echo "❌ Python tests${counts:+ ($counts)}" ;;
              *) echo "Python tests: ${PYTESTS:-skipped}" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

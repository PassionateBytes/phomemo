# CI: the gate for every change. Runs on pull requests and on pushes to main.
#
# Jobs:
#   releases  asks Fedora's Bodhi for every release that still gets updates,
#             from MIN_FEDORA on (fedora:latest when Bodhi is unreachable).
#   test      per release: lint and docs build (newest release only), printer
#             app build, C unit tests, Python tests including the end-to-end
#             tests against the built printer app.
#   rpm       per release: python-bleak built as COPR builds it, at the bleak
#             version locked in uv.lock, and installed; then phomemo-driver
#             built against it and installed. Catches a lock update Fedora
#             cannot satisfy before it reaches main.
#
# Renovate automerges dependency updates once this workflow is green: what it
# does not check, a dependency update can break unnoticed.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Bodhi lists two current releases most of the year, three for a few weeks
  # after a new release.
  releases:
    name: Fedora releases
    runs-on: ubuntu-latest
    env:
      # Older releases lack the dependency versions phomemo requires
      # (Fedora 43 ships Pillow 11.3, phomemo needs 12.1).
      MIN_FEDORA: 44
    outputs:
      all: ${{ steps.bodhi.outputs.all }}
      newest: ${{ steps.bodhi.outputs.newest }}
    steps:
      - id: bodhi
        shell: python
        run: |
          import json, os, re, urllib.request

          url = "https://bodhi.fedoraproject.org/releases/?state=current&rows_per_page=50"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  releases = json.load(response)["releases"]
              minimum = int(os.environ["MIN_FEDORA"])
              versions = sorted(
                  v
                  for r in releases
                  if (m := re.fullmatch(r"F(\d+)", r["name"])) and (v := int(m[1])) >= minimum
              )
          except Exception as error:
              print(f"::warning::Bodhi unreachable ({error}); testing fedora:latest only")
              versions = []
          names = [str(v) for v in versions] or ["latest"]
          print("Fedora releases:", ", ".join(names))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"all={json.dumps(names)}\nnewest={names[-1]}\n")

  test:
    name: Tests (Fedora ${{ matrix.fedora }})
    needs: releases
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.releases.outputs.all) }}
    steps:
      - name: Install build and test dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          gcc make pkgconf-pkg-config pappl-devel cjson-devel cups-devel
          python3 python3-pip git cups-ipptool ghostscript avahi util-linux
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv
      # The suite runs as an ordinary user, as on a developer machine: as
      # root, the printer application's test servers would use the system
      # socket and state paths instead of the per-test ones.
      - name: Create the test user
        run: |
          useradd --create-home tester
          chown -R tester "$GITHUB_WORKSPACE"
      - name: Python environment
        run: su tester -c "uv sync --all-packages"
      # Lint and docs do not depend on the Fedora release: newest only.
      - name: Lint
        id: lint
        if: matrix.fedora == needs.releases.outputs.newest
        run: su tester -c "uv run ruff check . && uv run ruff format --check ."
      - name: Build the printer application
        run: su tester -c "make -C src/printer-app"
      - name: C unit tests
        id: ctests
        run: su tester -c "make -C src/printer-app test"
      # The output is kept in /tmp/pytest.log for the summary; pipefail keeps
      # pytest's exit status as the step's.
      - name: Python tests (library, bridge, end-to-end against the built application)
        id: pytests
        run: su tester -c "set -o pipefail; uv run pytest -q src/phomemo/tests 2>&1 | tee /tmp/pytest.log"
      - name: Documentation
        id: docs
        if: matrix.fedora == needs.releases.outputs.newest
        run: su tester -c "uv run --package phomemo-docs sphinx-build -W --keep-going -b html docs docs/_build/html"
      - name: Summary
        if: always()
        shell: bash
        env:
          FEDORA: ${{ matrix.fedora }}
          LINT: ${{ steps.lint.outcome }}
          CTESTS: ${{ steps.ctests.outcome }}
          PYTESTS: ${{ steps.pytests.outcome }}
          DOCS: ${{ steps.docs.outcome }}
        run: |
          result() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *) echo "${1:-skipped}" ;;
            esac
          }
          counts=$(tail -n 1 /tmp/pytest.log 2>/dev/null | sed 's/^=* *//; s/ *=*$//')
          {
            echo "### Tests (Fedora $FEDORA)"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint (ruff) | $(result "$LINT") |"
            echo "| C unit tests | $(result "$CTESTS") |"
            echo "| Python tests | $(result "$PYTESTS")${counts:+ $counts} |"
            echo "| Documentation | $(result "$DOCS") |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Fedora has no bleak: python-bleak builds against Fedora's own dbus-fast.
  rpm:
    name: RPM packages (Fedora ${{ matrix.fedora }})
    needs: releases
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.releases.outputs.all) }}
    steps:
      - name: Install packaging tools
        run: >
          dnf install -y --setopt=install_weak_deps=False
          rpm-build rpmdevtools rpmlint python3-rpm-macros git make
      - uses: actions/checkout@v4
      - name: Mark the checkout safe for git archive
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Lint the spec file
        run: rpmlint packaging/rpm/phomemo-driver.spec
      - name: Source packages as COPR makes them
        run: |
          make -f .copr/Makefile srpm outdir="$PWD/dist" spec=packaging/rpm/python-bleak.spec
          make tarball
          cp packaging/rpm/phomemo-driver.spec dist/
      - name: Build and install the packages
        id: build
        shell: bash
        run: |
          defs=(--define "_sourcedir $PWD/dist" --define "_rpmdir $PWD/dist"
                --define "_srcrpmdir $PWD/dist")
          # The specs generate their Python build requirements in rounds
          # (the build backend first, then the package's own requirements);
          # keep installing them until rpmbuild -br finds nothing missing.
          build() {
            dnf builddep -y "$1"
            for round in 1 2 3 4 5; do
              rm -f dist/*.buildreqs.nosrc.rpm
              rpmbuild -br "${defs[@]}" "$1" && break
              dnf builddep -y dist/*.buildreqs.nosrc.rpm
            done
            rpmbuild -ba "${defs[@]}" "$1"
          }
          build dist/python-bleak.spec
          dnf install -y dist/noarch/python3-bleak-*.rpm
          build dist/phomemo-driver.spec
          dnf install -y dist/noarch/python3-phomemo-*.rpm dist/x86_64/phomemo-driver-*.rpm
          python3 -c "import bleak, phomemo, importlib.metadata as m; print('bleak', m.version('bleak'), 'phomemo', m.version('phomemo'))"
          ls -R dist
      - name: Summary
        if: always()
        shell: bash
        env:
          FEDORA: ${{ matrix.fedora }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          bleak=$(sed -n '/^name = "bleak"$/{n;s/^version = "\(.*\)"$/\1/p;}' uv.lock)
          {
            echo "### RPM packages (Fedora $FEDORA)"
            echo
            echo "bleak ${bleak:-unknown} (from uv.lock)"
            echo
            if [ "$BUILD" = failure ]; then
              echo "❌ Build or install failed"
              echo
            fi
            # shellcheck disable=SC2016  # literal backticks: Markdown code
            find dist -name '*.rpm' ! -name '*.src.rpm' ! -name '*.nosrc.rpm' \
              ! -name '*-debuginfo-*' ! -name '*-debugsource-*' -printf '- `%f`\n' 2>/dev/null | sort
          } >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Fedora 44)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build and test dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          gcc make pkgconf-pkg-config pappl-devel cups-devel
          python3 python3-pip git cups-ipptool ghostscript avahi
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv
      # The suite runs as an ordinary user, as on a developer machine: as
      # root, the printer application's test servers would use the system
      # socket and state paths instead of the per-test ones.
      - name: Create the test user
        run: |
          useradd --create-home tester
          chown -R tester "$GITHUB_WORKSPACE"
      - name: Python environment
        run: su tester -c "uv sync"
      - name: Lint
        run: su tester -c "uv run ruff check . && uv run ruff format --check ."
      - name: Build the printer application
        run: su tester -c "make -C printer-app"
      - name: C unit tests
        run: su tester -c "make -C printer-app test"
      - name: Python tests (library, bridge, end-to-end against the built application)
        run: su tester -c "uv run pytest -q"

  rpm:
    name: RPM build (Fedora 44)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install packaging tools
        run: >
          dnf install -y --setopt=install_weak_deps=False
          rpm-build rpmlint git make dnf-plugins-core
      - name: Enable the project's COPR repository (python3-bleak is not in Fedora)
        run: dnf copr enable -y passionatebytes/phomemo-driver
      - uses: actions/checkout@v4
      - name: Mark the checkout safe for git archive
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Lint the spec file
        run: rpmlint packaging/rpm/phomemo-driver.spec
      - name: Build the packages
        run: |
          make tarball
          defs=(--define "_sourcedir $PWD/dist" --define "_rpmdir $PWD/dist"
                --define "_srcrpmdir $PWD/dist")
          dnf builddep -y packaging/rpm/phomemo-driver.spec
          # The spec generates its Python build requirements in rounds (the
          # build backend first, then the package's own requirements); keep
          # installing them until rpmbuild -br finds nothing missing.
          for round in 1 2 3 4 5; do
            rm -f dist/*.buildreqs.nosrc.rpm
            rpmbuild -br "${defs[@]}" packaging/rpm/phomemo-driver.spec && break
            dnf builddep -y dist/*.buildreqs.nosrc.rpm
          done
          rpmbuild -ba "${defs[@]}" packaging/rpm/phomemo-driver.spec
          ls -R dist
        shell: bash

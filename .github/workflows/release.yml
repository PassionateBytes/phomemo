# Release: publishes a version. Runs on v* tags, made with
#   make release VERSION=x.y.z   (or major, minor, patch)
#   git push && git push origin vx.y.z
#
# Jobs:
#   python          checks that the tag matches the package version, builds
#                   wheel and sdist.
#   srpm            source RPM and source tarball (make srpm).
#   pypi            uploads wheel and sdist to PyPI by trusted publishing
#                   (environment "pypi").
#   github-release  GitHub release with generated notes and every artefact;
#                   0.x versions are published as pre-releases. Waits for
#                   pypi only to report its result: a failed upload does not
#                   block the release.
#
#   copr            asks COPR to build phomemo-driver (its build picks the
#                   newest v* tag, .copr/Makefile) through the project's
#                   custom webhook, secret COPR_WEBHOOK; skipped with a
#                   warning when the secret is unset.
#   obs             asks the Open Build Service to run the phomemo-driver
#                   source service (packaging/obs/, picks the newest v* tag
#                   too) with the token OBS_TOKEN in the project named by
#                   the repository variable OBS_PROJECT; skipped with a
#                   warning when either is unset.
#
# The versioned docs (docs.yml) build from the same tag through their own
# trigger.

name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

jobs:
  python:
    name: Build the phomemo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check that the tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/phomemo/pyproject.toml)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $version"; exit 1; }
      - name: Build wheel and sdist
        run: uv build src/phomemo --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/

  srpm:
    name: Source RPMs
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install packaging tools
        run: dnf install -y --setopt=install_weak_deps=False rpm-build git make
      - uses: actions/checkout@v4
      - name: Mark the checkout safe for git archive
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build source RPMs
        run: make srpm
      - uses: actions/upload-artifact@v4
        with:
          name: srpm
          path: |
            dist/*.src.rpm
            dist/*.tar.gz

  pypi:
    name: Publish to PyPI
    needs: python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: [python, srpm, pypi]
    if: ${{ !cancelled() && needs.python.result == 'success' && needs.srpm.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Create the release with generated notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        # Versions before 1.0 are beta releases: published as pre-releases.
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --title "phomemo-driver ${GITHUB_REF_NAME#v}"
          --generate-notes
          $([[ "${GITHUB_REF_NAME}" == v0.* ]] && echo --prerelease)
          artifacts/python/* artifacts/srpm/*
      - name: Summary
        if: always()
        env:
          PYPI: ${{ needs.pypi.result }}
          RELEASE: ${{ steps.release.outcome }}
          REPO: ${{ github.repository }}
        run: |
          result() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *) echo "${1:-skipped}" ;;
            esac
          }
          version=${GITHUB_REF_NAME#v}
          kind=release
          [[ "$GITHUB_REF_NAME" == v0.* ]] && kind=pre-release
          {
            echo "### phomemo-driver $version"
            echo
            echo "| Target | Link | Result |"
            echo "|---|---|---|"
            echo "| PyPI | https://pypi.org/project/phomemo/$version/ | $(result "$PYPI") |"
            echo "| GitHub $kind | https://github.com/$REPO/releases/tag/$GITHUB_REF_NAME | $(result "$RELEASE") |"
            echo "| Docs | https://passionatebytes.github.io/phomemo-driver/$version/ | built by the Docs workflow |"
            echo
            # shellcheck disable=SC2016  # literal backticks: Markdown code
            echo "Artefacts: $(find artifacts -type f -printf '`%f`\n' 2>/dev/null | sort | paste -sd ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

  copr:
    name: COPR build
    needs: [python, srpm]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the phomemo-driver build
        env:
          COPR_WEBHOOK: ${{ secrets.COPR_WEBHOOK }}
        run: |
          if [ -z "$COPR_WEBHOOK" ]; then
            echo "::warning::COPR_WEBHOOK is not set; COPR was not asked to build"
            echo "COPR: not triggered (secret COPR_WEBHOOK unset)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url=$(printf '%s' "$COPR_WEBHOOK" | tr -d '[:space:]')
          if ! [[ "$url" =~ ^https://copr\.fedorainfracloud\.org/webhooks/custom/[0-9]+/[0-9a-fA-F-]+/?$ ]]; then
            echo "::error::COPR_WEBHOOK is not a COPR custom webhook URL (expected https://copr.fedorainfracloud.org/webhooks/custom/<ID>/<UUID>/, without a package name)"
            exit 1
          fi
          # COPR answers with the new build's ID, or with an error token.
          for attempt in 1 2 3; do
            reply=$(curl -sS -X POST -w '\n%{http_code}' "${url%/}/phomemo-driver/") || reply=$'\n000'
            code=${reply##*$'\n'}
            body=$(printf '%s' "${reply%$'\n'*}" | head -c 200 | head -n 1)
            [ "$code" = 200 ] && break
            echo "::warning::COPR answered HTTP $code (${body:-no body}), attempt $attempt of 3"
            sleep $((attempt * 20))
          done
          if [ "$code" != 200 ]; then
            echo "::error::COPR did not accept the phomemo-driver build: HTTP $code (${body:-no body})"
            echo "COPR: COPR refused the phomemo-driver build (HTTP $code: ${body:-no body})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          build=$(printf '%s' "$body" | tr -dc '0-9')
          echo "COPR: [phomemo-driver build ${build:-requested}](https://copr.fedorainfracloud.org/coprs/build/${build}/)" >> "$GITHUB_STEP_SUMMARY"

  obs:
    name: OBS build
    needs: [python, srpm]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the phomemo-driver service run
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
          OBS_PROJECT: ${{ vars.OBS_PROJECT }}
        run: |
          if [ -z "$OBS_TOKEN" ] || [ -z "$OBS_PROJECT" ]; then
            echo "::warning::OBS_TOKEN or OBS_PROJECT is not set; OBS was not asked to build"
            echo "OBS: not triggered (secret OBS_TOKEN or variable OBS_PROJECT unset)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! [[ "$OBS_PROJECT" =~ ^[A-Za-z0-9_.:-]+$ ]]; then
            echo "::error::OBS_PROJECT is not an OBS project name (expected something like home:<user>:phomemo-driver)"
            exit 1
          fi
          # The token travels in a curl config read from stdin, never on the
          # command line. OBS answers <status code="ok"/> when the service
          # run is queued.
          url="https://api.opensuse.org/trigger/runservice?project=${OBS_PROJECT}&package=phomemo-driver"
          for attempt in 1 2 3; do
            reply=$(printf 'header = "Authorization: Token %s"\n' "$OBS_TOKEN" |
              curl -sS -K - -X POST -w '\n%{http_code}' "$url") || reply=$'\n000'
            code=${reply##*$'\n'}
            body=$(printf '%s' "${reply%$'\n'*}" | tr -d '\n' | head -c 300)
            [ "$code" = 200 ] && break
            echo "::warning::OBS answered HTTP $code (${body:-no body}), attempt $attempt of 3"
            sleep $((attempt * 20))
          done
          if [ "$code" != 200 ] || [[ "$body" != *'code="ok"'* ]]; then
            echo "::error::OBS did not queue the phomemo-driver service run: HTTP $code (${body:-no body})"
            echo "OBS: service run refused (HTTP $code: ${body:-no body})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "OBS: [phomemo-driver service run queued](https://build.opensuse.org/package/show/${OBS_PROJECT}/phomemo-driver)" >> "$GITHUB_STEP_SUMMARY"

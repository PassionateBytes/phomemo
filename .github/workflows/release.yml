# Release: publishes a version. Runs on v* tags, made with
#   make bump VERSION=x.y.z
#   make tag
#   git push && git push origin vx.y.z
#
# Jobs:
#   python          checks that the tag matches the package version, builds
#                   wheel and sdist.
#   srpm            source RPM and source tarball (make srpm).
#   pypi            uploads wheel and sdist to PyPI by trusted publishing
#                   (environment "pypi").
#   github-release  GitHub release with generated notes and every artefact;
#                   0.x versions are published as pre-releases. Waits for
#                   pypi only to report its result: a failed upload does not
#                   block the release.
#
#   copr            asks COPR to build phomemo-driver (its build picks the
#                   newest v* tag, .copr/Makefile) through the project's
#                   custom webhook, secret COPR_WEBHOOK; skipped with a
#                   warning when the secret is unset.
#
# The versioned docs (docs.yml) build from the same tag through their own
# trigger.

name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

jobs:
  python:
    name: Build the phomemo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check that the tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/phomemo/pyproject.toml)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $version"; exit 1; }
      - name: Build wheel and sdist
        run: uv build src/phomemo --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/

  srpm:
    name: Source RPMs
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install packaging tools
        run: dnf install -y --setopt=install_weak_deps=False rpm-build git make
      - uses: actions/checkout@v4
      - name: Mark the checkout safe for git archive
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build source RPMs
        run: make srpm
      - uses: actions/upload-artifact@v4
        with:
          name: srpm
          path: |
            dist/*.src.rpm
            dist/*.tar.gz

  pypi:
    name: Publish to PyPI
    needs: python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: [python, srpm, pypi]
    if: ${{ !cancelled() && needs.python.result == 'success' && needs.srpm.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Create the release with generated notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        # Versions before 1.0 are beta releases: published as pre-releases.
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --title "phomemo-driver ${GITHUB_REF_NAME#v}"
          --generate-notes
          $([[ "${GITHUB_REF_NAME}" == v0.* ]] && echo --prerelease)
          artifacts/python/* artifacts/srpm/*
      - name: Summary
        if: always()
        env:
          PYPI: ${{ needs.pypi.result }}
          RELEASE: ${{ steps.release.outcome }}
          REPO: ${{ github.repository }}
        run: |
          result() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *) echo "${1:-skipped}" ;;
            esac
          }
          version=${GITHUB_REF_NAME#v}
          kind=release
          [[ "$GITHUB_REF_NAME" == v0.* ]] && kind=pre-release
          {
            echo "### phomemo-driver $version"
            echo
            echo "| Target | Link | Result |"
            echo "|---|---|---|"
            echo "| PyPI | https://pypi.org/project/phomemo/$version/ | $(result "$PYPI") |"
            echo "| GitHub $kind | https://github.com/$REPO/releases/tag/$GITHUB_REF_NAME | $(result "$RELEASE") |"
            echo "| Docs | https://passionatebytes.github.io/phomemo-driver/$version/ | built by the Docs workflow |"
            echo
            # shellcheck disable=SC2016  # literal backticks: Markdown code
            echo "Artefacts: $(find artifacts -type f -printf '`%f`\n' 2>/dev/null | sort | paste -sd ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

  copr:
    name: COPR build
    needs: [python, srpm]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the phomemo-driver build
        env:
          COPR_WEBHOOK: ${{ secrets.COPR_WEBHOOK }}
        run: |
          if [ -z "$COPR_WEBHOOK" ]; then
            echo "::warning::COPR_WEBHOOK is not set; COPR was not asked to build"
            echo "COPR: not triggered (secret COPR_WEBHOOK unset)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsS -X POST -o /dev/null "${COPR_WEBHOOK%/}/phomemo-driver/"
          echo "COPR: [phomemo-driver build requested](https://copr.fedorainfracloud.org/coprs/passionatebytes/phomemo-driver/builds/)" >> "$GITHUB_STEP_SUMMARY"

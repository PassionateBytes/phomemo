# phomemo-printer-app server configuration.
#
# One option per line as name=value; lines starting with # are comments. The
# commented values are the defaults. The server reads, in this order, options
# given with -o on its command line, ~/.config/phomemo-printer-app.conf of the
# user running it, /usr/local/etc/phomemo-printer-app.conf and this file; the
# first place that sets an option wins. Restart the service after a change:
#
#   sudo systemctl restart phomemo-printer-app
#
# An option the server does not know is ignored without a message.

# How much the server logs to the journal: fatal, error, warn, info or debug.
# info shows the port, registered printers and every job.
log-level=info

# TCP port for IPP and the web interface. Without it the server tries
# 8000 + (user ID % 1000), so 8000 when it runs as root, and counts up past
# ports already in use. Clients find the actual port through DNS-SD; to see
# it yourself:
#
#   journalctl -u phomemo-printer-app | grep "Listening for connections"
#   avahi-browse -rt _ipp._tcp
#
#server-port=8000

# Network address to listen on, for example localhost to refuse connections
# from other machines. Without it the server listens on all addresses.
#listen-hostname=localhost

# Host name the server advertises in its URIs and DNS-SD records. Without it
# the system's host name is used.
#server-hostname=printers.example.com

# Comma-separated changes to the server's features. By default it serves
# several printers, a web interface and TLS; these keywords change that:
#   none              drop the defaults, keep only what follows
#   dnssd-host        add the host name to the DNS-SD service names
#   no-multi-queue    allow only one printer
#   no-web-interface  no web interface
#   no-tls            no TLS for IPP or the web interface
#   raw-socket        also accept raw print data on ports 9100 and up
#   web-network       network settings pages in the web interface
#   web-security      user and password settings pages
#   web-log           show the server log in the web interface
#   web-remote        allow the web interface from other machines
#server-options=web-log

# PAM service that authenticates web interface and IPP users who change
# settings from another machine. Without it, changes are allowed from this
# machine only.
#auth-service=login

# Unix group whose members may change settings once auth-service is set.
#admin-group=wheel

# Directory for spooled jobs. Without it the server picks one itself.
#spool-directory=/var/spool/phomemo-printer-app

# Configuration for phomemo-printer-app
# -------------------------------------
# One setting per line as name=value; lines starting with # are comments.
# Every setting is optional; a commented-out line shows the default.
# Read after -o options on the command line, ~/.config/phomemo-printer-app.conf
# and /usr/local/etc/phomemo-printer-app.conf; the first that sets one wins.
# Unknown settings are ignored without a message.
# Apply changes with: sudo systemctl restart phomemo-printer-app

# Log detail in the journal: fatal, error, warn, info or debug.
log-level=info

# Port for IPP and the web interface (default 8000 + UID % 1000, next free).
#server-port=8000

# Address to listen on; localhost refuses connections from other machines.
#listen-hostname=localhost

# Host name advertised in URIs and DNS-SD records (default: system host name).
#server-hostname=printers.example.com

# Feature changes, comma-separated: none, dnssd-host, no-multi-queue,
# no-web-interface, no-tls, raw-socket, web-log, web-network, web-remote,
# web-security.
#server-options=web-log

# PAM service that lets users change settings from other machines.
#auth-service=login

# Group allowed to change settings once auth-service is set.
#admin-group=wheel

# Directory for spooled jobs (default: chosen by the server).
#spool-directory=/var/spool/phomemo-printer-app

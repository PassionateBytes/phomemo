# Configuration for phomemo-bridge
# --------------------------------
# One setting per line as name = value; lines starting with # are comments.
# Every setting is optional; a commented-out line shows the default.
# Read from this file, then $XDG_CONFIG_HOME/phomemo/bridge.toml for a bridge
# run by that user; the later file wins. Unusable settings are logged
# (journalctl -u phomemo-bridge) and keep their default.
# Apply changes with: sudo systemctl restart phomemo-bridge

# Auto-off set on the printer at each connection (5-min steps, 0 = never); unset:
# the printer keeps its own setting.
#auto_off_minutes = 5

# Minutes without a command before the connection is dropped (0 = until printer off).
#idle_disconnect_minutes = 30

# Longest wait in seconds for an inserted sheet to settle at the print head.
#settle_seconds = 3

# Longest wait in seconds for the motor to stop after a page.
#completion_timeout = 300

# Pause in seconds after a cancelled page before the sheet is ejected.
#drain_seconds = 1

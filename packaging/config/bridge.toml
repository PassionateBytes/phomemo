# phomemo-bridge configuration. Every key is optional; the values shown are
# the defaults. A user's own file at $XDG_CONFIG_HOME/phomemo/bridge.toml
# overrides this one for a user-run bridge.

# Seconds the printer link stays up after a job so the next one skips the
# reconnect.
#hold_seconds = 120

# Cap on the wait for an inserted sheet to seat at the head.
#settle_seconds = 3

# Seconds to wait for the motor to stop after a page.
#completion_timeout = 300

# Pause after a cancelled transfer before ejecting.
#drain_seconds = 1

[printer]
# BLE address of the printer; without it the bridge takes the first M08F it
# finds by name.
#address = "AA:BB:CC:DD:EE:FF"
#profile = "M08F-A4"

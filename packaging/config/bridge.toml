# phomemo-bridge configuration. Every key is optional; the values shown are
# the defaults. A user's own file at $XDG_CONFIG_HOME/phomemo/bridge.toml
# overrides this one for a user-run bridge.

# Seconds the printer link stays up after a job so the next one skips the
# reconnect.
#hold_seconds = 300

# Cap on the wait for an inserted sheet to seat at the head.
#settle_seconds = 3

# Seconds to wait for the motor to stop after a page.
#completion_timeout = 300

# Pause after a cancelled transfer before ejecting.
#drain_seconds = 1

[printer]
# BLE address of the printer. Without it the bridge uses the printer the
# printer application asks for, else the one linked last, else the only M08F a
# scan finds (several in range: it refuses and lists them).
#address = "AA:BB:CC:DD:EE:FF"
#profile = "M08F-A4"

# Auto-off timer the bridge sets on the printer at each new link, in minutes:
# a multiple of 5 up to 1275, 0 = never switch off. An invalid value is logged
# and replaced by 5.
#auto_off_minutes = 5

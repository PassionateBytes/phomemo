[project]
name = "phomemo"
version = "0.4.0"
description = "Async BLE driver library for Phomemo thermal printers"
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-3.0-or-later"
license-files = { paths = ["COPYING", "COPYING.LESSER"] }
authors = [{ name = "Paul Bütof, Passionate Bytes Solutions" }]
keywords = ["phomemo", "thermal printer", "bluetooth", "ble", "m08f", "printing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "bleak>=0.21.0,<4",
    "pillow>=10.1.0,<14",
]

[project.urls]
Homepage = "https://github.com/PassionateBytes/phomemo-driver"
Documentation = "https://passionatebytes.github.io/phomemo-driver/"
Source = "https://github.com/PassionateBytes/phomemo-driver"
Issues = "https://github.com/PassionateBytes/phomemo-driver/issues"

[project.scripts]
phomemo-bridge = "phomemo.bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phomemo"]

[tool.hatch.build.hooks.custom]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
    "ty>=0.0.26",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project]
name = "phomemo"
version = "0.1.0"
description = "Async BLE driver library for Phomemo thermal printers"
readme = "README.md"
requires-python = ">=3.13"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
dependencies = [
    "bleak>=3.0.0,<4",
    "pillow>=12.1.0",
]

[project.scripts]
phomemo-bridge = "phomemo.bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phomemo"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
    "ty>=0.0.26",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
